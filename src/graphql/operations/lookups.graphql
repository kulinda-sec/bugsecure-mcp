# Small read-only lookups shared by the write tools: the safety checks a tool
# makes before asking for, and before sending, a write (who the caller is,
# whose report it is). Each tool lists the scopes they need in `requiredScopes`
# (when the check is mandatory) or `optionalScopes` (when the tool can refuse
# or proceed without it). What the ids refer to is shown to the user by the
# BugSecure review page itself, so no lookup here exists for display alone.

# The caller's roles (profile:read): platform staff are refused organisation-side writes.
query GetViewerRoles {
  me {
    id
    roles
  }
}

# A report's reporter (reports:read or triage:read): tells the caller's own
# reports from their organisations'.
query GetReportRef($id: ID!) {
  report(id: $id) {
    id
    reporter {
      id
    }
  }
}

# A report's reporter and the grade in force on it (reports:read): an appeal is
# raised only against the grade in force on one of the caller's own reports.
query GetAppealTarget($reportId: ID!) {
  report(id: $reportId) {
    id
    reporter {
      id
    }
  }
  reportAdjudication(reportId: $reportId) {
    id
  }
}
