# Tool: submit_report (reports:write)
mutation SubmitReport($input: SubmitReportInput!, $clientRequestId: String!) {
  submitReport(input: $input, clientRequestId: $clientRequestId) {
    id
    title
    status
    claimedSeverity
    claimedCvssScore
    createdAt
    program {
      id
      title
      slug
    }
  }
}
