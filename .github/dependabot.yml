version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let new releases age before we adopt them (supply-chain hygiene).
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: 'chore(docker)'
