name: Feature request
description: Suggest a tool or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: If this is a new tool, which OAuth scope would it need, and does it change anything (write)?
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Could the feature expose third-party content to the model, widen access, or act without the user's clear intent?
